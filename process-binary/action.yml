name: process-binary
description: A composite action running rcedit, sign-file and virustotal
inputs:
  path:
    description: The path to the binary to process, glob patterns allowed
    required: true
  signing-endpoint:
    description:
      Azure Artifact Signing endpoint, e.g. https://weu.codesigning.azure.net.
      Signing runs on Windows when signing-account is set; the job must have run
      azure/login (OIDC) first.
    required: false
    default: ''
  signing-account:
    description: Azure Artifact Signing account name. Empty = do not sign.
    required: false
    default: ''
  signing-profile:
    description: Azure Artifact Signing certificate profile name
    required: false
    default: ''
  certificate-base64:
    description: Deprecated, ignored. Signing now uses Azure Artifact Signing.
    required: false
    default: ''
  certificate-password:
    description: Deprecated, ignored. Signing now uses Azure Artifact Signing.
    required: false
    default: ''
  virustotal-api-key:
    description: The VirusTotal API key
    required: true
  gh-token:
    description: GitHub token used for writing commit status
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - uses: exivity/actions/rcedit@main
      if: runner.os == 'Windows'
      with:
        path: ${{ inputs.path }}
    - uses: exivity/actions/sign-file@main
      if: runner.os == 'Windows' && inputs.signing-account != ''
      with:
        path: ${{ inputs.path }}
        method: artifact-signing
        endpoint: ${{ inputs.signing-endpoint }}
        account-name: ${{ inputs.signing-account }}
        certificate-profile-name: ${{ inputs.signing-profile }}
        description: Exivity Core
        description-url: https://exivity.com
    - uses: exivity/actions/virustotal@main
      with:
        path: ${{ inputs.path }}
        virustotal-api-key: ${{ inputs.virustotal-api-key }}
        gh-token: ${{ inputs.gh-token }}
