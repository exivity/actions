name: maintenance-release-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run:
          node --test release/src/common/*.test.js
          build-push-image/src/identity.test.js
          put-artefacts/src/*.test.js
